# ============================================
#  Cope Nights - config.yml
#  /coni reload after editing
# ============================================

# Colors: &#RRGGBB, or <gradient:#FF8C1A:#A80000>text</gradient> (2+ colors, &l etc. work inside)
# Palette: blood #5A0000 | dark red #A80000 | orange #FF8C1A | ember #FFB366 | cream #FFE4C7
prefix: "&#5A0000&l☾ <gradient:#FF8C1A:#A80000>&lConi</gradient> &#5A0000» &#FFB366"

# Random scares that run on their own while /coni toggle on is active.
# (Whether auto mode is ON is saved in data.yml so it survives restarts.)
auto:
  # How often the plugin rolls for each online player (seconds)
  check-interval-seconds: 30
  # Chance (0.0 - 1.0) that a player gets scared on each roll
  chance-per-check: 0.08
  # Minimum time between auto scares for the same player (seconds)
  player-cooldown-seconds: 300
  # Only scare at night (world time 13000 - 23000)
  night-only: false
  # Only scare players standing somewhere dark (light level 7 or less)
  dark-only: false
  # Only scare players in survival/adventure (skips creative/spectator)
  survival-only: true
  # Worlds where auto scares can happen. Empty list = all worlds.
  worlds: []
  # Weights for which scare gets picked. 0 = never picked by auto mode.
  weights:
    SOUNDS: 30
    FOOTSTEPS: 20
    WHISPER: 14
    CREEPER: 10
    HEROBRINE: 12
    STALKER: 6
    BLACKOUT: 4
    JUMPSCARE: 3
    LIGHTNING: 0
    SKY_DROP: 5
    BURIED: 8
    LIGHTS_OUT: 8
    FAKE_TNT: 6
    TURN_AROUND: 5
    FAKE_JOIN: 8
    KNOCK: 10
    SURROUNDED: 10
    PHANTOM_HIT: 8

herobrine:
  # Account name whose skin is used for the head. Swap this for any
  # account that wears a Herobrine skin if the default looks wrong.
  skin-name: "Herobrine"
  # Or paste a direct skin URL (overrides skin-name), e.g.
  # http://textures.minecraft.net/texture/<hash>
  skin-url: ""
  # Distant sighting (HEROBRINE)
  min-distance: 14
  max-distance: 26
  lifetime-seconds: 12
  # Vanishes after the player stares at him this long...
  vanish-look-seconds: 1.5
  # ...or walks closer than this
  vanish-distance: 8
  # Stalker (STALKER) - stands right behind the player until they turn around
  stalker-lifetime-seconds: 10

whisper:
  # %msg% is replaced with one of the lines below
  format: "<gradient:#A80000:#5A0000><Herobrine></gradient> &#FFB366&o%msg%"
  messages:
    - "I see you."
    - "Behind you."
    - "Why are you still here?"
    - "You shouldn't have come down here."
    - "Don't turn around."
    - "..."

jumpscare:
  title: "<gradient:#FF2A00:#5A0000>&l☠</gradient>"
  subtitle: "<gradient:#FFB366:#A80000>&ofound you</gradient>"

# SKY_DROP: yanked into the sky, free fall, then put back exactly where they stood.
# Fall damage is always cancelled. ~2.5s of falling from 100 blocks gets them close to the ground.
sky-drop:
  height: 100
  seconds: 2.5
  title: "<gradient:#FF8C1A:#5A0000>&lFALLING</gradient>"
  subtitle: "<gradient:#FFB366:#A80000>&ohe let go of you</gradient>"

# FAKE_JOIN: fake join message only the target sees
fake-join:
  name: "Herobrine"
  messages:
    - "hi %player%"
    - "why are you alone"
    - "i'm in your base"
    - "don't log off"
