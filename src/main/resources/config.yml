# =============================================================================
#  Cope Nights - config.yml
#  Run /coni reload after editing.
#
#  This file has the SETTINGS. Every text (chat lines, titles, whispers, the
#  prefix...) now lives in messages.yml. Blood Moon settings are in bloodmoon.yml
#  (most of them are also editable in-game with /coni bloodmoon).
#
#  New settings added in future updates are written into this file
#  automatically, and a broken file is repaired (the old one is kept as
#  config.yml.broken-<date>).
# =============================================================================

# -----------------------------------------------------------------------------
#  Auto scares: random scares that run on their own while /coni toggle is ON.
#  (Whether auto mode is ON is saved in data.yml so it survives restarts.)
# -----------------------------------------------------------------------------
auto:
  # How often the plugin rolls for each online player (seconds, minimum 5)
  check-interval-seconds: 30
  # Chance (0.0 - 1.0) that a player gets scared on each roll
  chance-per-check: 0.08
  # Minimum time between auto scares for the same player (seconds)
  player-cooldown-seconds: 300
  # Only scare at night (world time 13000 - 23000). Nether and End always count as night.
  night-only: false
  # Only scare players standing somewhere dark (light level 7 or less)
  dark-only: false
  # Only scare players in survival/adventure (skips creative/spectator)
  survival-only: true
  # Worlds where auto scares can happen. Empty list = all worlds.
  worlds: []
  # NEW: never scare a player who has one of these shared CopeCore states.
  # Other Cope plugins set them: combat (CSCombat), in-duel / in-arena (CSSPVP),
  # boss-fight (Cope Bosses), editing (someone typing in an editor).
  # The same list is used for Blood Moon scares. [] = scare everyone.
  skip-states:
    - combat
    - in-duel
    - in-arena
    - boss-fight
    - editing
  # Weights for which scare gets picked. 0 = never picked by auto mode.
  weights:
    SOUNDS: 30
    FOOTSTEPS: 20
    WHISPER: 14
    CREEPER: 10
    HEROBRINE: 12
    STALKER: 6
    BLACKOUT: 4
    JUMPSCARE: 3
    LIGHTNING: 0
    SKY_DROP: 5
    BURIED: 8
    LIGHTS_OUT: 8
    FAKE_TNT: 6
    TURN_AROUND: 5
    FAKE_JOIN: 8
    KNOCK: 10
    SURROUNDED: 10
    PHANTOM_HIT: 8

# -----------------------------------------------------------------------------
#  Herobrine
# -----------------------------------------------------------------------------
herobrine:
  # Account name whose skin is used for the head. Swap this for any
  # account that wears a Herobrine skin if the default looks wrong.
  skin-name: "Herobrine"
  # Or paste a direct skin URL (overrides skin-name), e.g.
  # http://textures.minecraft.net/texture/<hash>
  skin-url: ""
  # Distant sighting (HEROBRINE)
  min-distance: 14
  max-distance: 26
  lifetime-seconds: 12
  # Vanishes after the player stares at him this long...
  vanish-look-seconds: 1.5
  # ...or walks closer than this
  vanish-distance: 8
  # Stalker (STALKER) - stands right behind the player until they turn around
  stalker-lifetime-seconds: 10

# -----------------------------------------------------------------------------
#  SKY_DROP: yanked into the sky, free fall, then put back exactly where they stood.
#  Fall damage is always cancelled. ~2.5s of falling from 100 blocks gets them
#  close to the ground. (The title texts are in messages.yml: scares.sky-drop)
# -----------------------------------------------------------------------------
sky-drop:
  height: 100
  seconds: 2.5
