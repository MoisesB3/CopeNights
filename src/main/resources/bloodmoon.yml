# =============================================================================
#  Cope Nights - bloodmoon.yml
#  Most of this is editable in-game: /coni bloodmoon
#  (The menu keeps the comments in this file when it saves.)
#
#  All Blood Moon TEXTS (titles, boss bar, wave announcements, death messages)
#  are in messages.yml under "bloodmoon:" and "death:".
# =============================================================================

enabled: true
# A blood moon happens on every Nth Minecraft day (day 7, 14, 21... with 7)
every-days: 7

# Worlds that get blood moons. Empty list = every overworld-type world.
worlds: []

# --- Mobs ---
# 2.0 = every natural hostile spawn brings one extra mob. 2.5 = 50% chance of a second extra.
spawn-multiplier: 2.0
health-multiplier: 1.5
damage-multiplier: 1.5
speed-multiplier: 1.15
# Chance a blood moon mob is a giant, and how big giants get.
# Giants need Minecraft 1.20.5 or newer (the "scale" attribute). On older servers they are skipped.
giant-chance: 0.10
giant-scale: 1.8
# Chance a natural spawn is swapped for one of the special-mobs below
special-chance: 0.20
# Safety cap: max blood moon mobs alive per world
max-mobs: 400
# Mobs that don't exist on your server version (e.g. BOGGED and BREEZE need 1.21) are skipped automatically.
special-mobs:
  - WITHER_SKELETON
  - VINDICATOR
  - PILLAGER
  - WITCH
  - BLAZE
  - PHANTOM
  - CAVE_SPIDER
  - HUSK
  - STRAY
  - BOGGED

# --- Hordes ---
# Waves of hordes hit random survival players all night. Wave 1 comes soon after
# moonrise, then one wave every horde-interval-seconds. Each wave sends 1 horde per
# horde-players-per-horde players online (each on a different player), and hordes
# grow by horde-growth mobs every wave until horde-max-size.
# Summon one by hand anytime: /coni bm horde <player> [size]
hordes: true
horde-first-delay-seconds: 30
horde-interval-seconds: 90
horde-size: 4
horde-growth: 2
horde-max-size: 30
horde-players-per-horde: 2
horde-max-per-wave: 5
horde-radius: 16
# A glowing, oversized zombie with double health leads each horde
horde-captain: true
# Mobs hordes are built from (special-chance can still swap in special-mobs)
horde-mobs:
  - ZOMBIE
  - HUSK
  - SKELETON
  - SPIDER
  - CREEPER
  - ZOMBIE_VILLAGER
  - DROWNED
# NEW: automatic hordes skip players with one of these CopeCore states
# (nobody gets a horde in the middle of a duel or an arena fight). [] = nobody is skipped.
horde-skip-states:
  - in-duel
  - in-arena
  - boss-fight

# --- Horde bosses (Cope Bosses) ---
# Chance each horde also brings a boss
horde-boss-chance: 0.30
horde-bosses:
  - frost-colossus
  - hunter
  - inferno-brute
  - shadow-assassin
  - skeleton-king
  - storm-caller
  - wizard
# Placeholders: <boss> <player> <world> <x> <y> <z>  (the old %boss% style also works)
horde-boss-command: "cb spawn <boss>"
# player  = run as the horde's target, so the boss spawns where they stand
#           (they get the permissions below for that one command only)
# console = run from console (use <x> <y> <z> if your command takes coordinates)
horde-boss-run-as: player
horde-boss-permissions:
  - copebosses.admin
  - copebosses.spawn

# --- Rewards ---
drop-multiplier: 1.5
xp-multiplier: 2.0
survivor-rewards: true
# Run from console for every player in the world who didn't die during the blood moon.
# Placeholder: <player>  (the old %player% style also works)
reward-commands:
  - "give <player> minecraft:golden_apple 1"

# --- Atmosphere ---
block-sleep: true
red-sky: true
boss-bar: true
thunder: true
despawn-at-end: true

# --- Blood moon scares ---
# Runs all night on survival players, even when /coni toggle is OFF.
# Players with a state from config.yml "auto.skip-states" are never scared.
scares: true
scare-interval-seconds: 40
# Chance each player gets scared every roll
scare-chance: 0.30
# Scare everyone gets when the blood moon rises (NONE to disable)
moonrise-scare: LIGHTS_OUT
# A horde's target gets one of these as a warning, then the horde hits 4s later. [] = no warning
horde-warning-scares:
  - KNOCK
  - SURROUNDED
  - WHISPER
  - FOOTSTEPS
# Which scares the blood moon picks (higher = more often, 0 = never)
scare-weights:
  HEROBRINE: 12
  STALKER: 8
  TURN_AROUND: 8
  JUMPSCARE: 6
  SKY_DROP: 6
  BURIED: 8
  LIGHTS_OUT: 6
  FAKE_TNT: 8
  BLACKOUT: 8
  PHANTOM_HIT: 10
  SURROUNDED: 6
  FOOTSTEPS: 6
  KNOCK: 6
  WHISPER: 6
  FAKE_JOIN: 4
  SOUNDS: 4
  CREEPER: 6
  LIGHTNING: 4
# Extra multiplier for the normal /coni auto scares during a blood moon (needs /coni toggle on)
scare-boost: 2.5
announce: true
# Coni death messages for horde / blood moon mob / mob / player kills (texts: messages.yml "death:")
death-messages: true
